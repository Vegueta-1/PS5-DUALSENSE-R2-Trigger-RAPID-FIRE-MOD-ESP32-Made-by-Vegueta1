<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 DualSense RapidFire ESP32-C3 Flasher</title>

  <!-- ESP Web Tools -->
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1219;
      color: #e7edf4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { color: #ffb02e; margin-bottom: 8px; }
    p { color: #8fa0b3; max-width: 480px; }
    .card {
      background: #18202c;
      border: 1px solid #26313f;
      border-radius: 12px;
      padding: 32px 40px;
      margin-top: 24px;
      width: 360px;
    }
    esp-web-install-button {
      margin-top: 16px;
    }
    .note {
      font-size: 13px;
      color: #5c6b7d;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>PS5 DualSense RapidFire</h1>
  <p>ESP32-C3 Firmware Flasher (v7.4.7)</p>

  <div class="card">
    <p>Connect your ESP32-C3 via USB, then click the button below.</p>

    <esp-web-install-button manifest="manifest.json">
      <button slot="activate">Install RapidFire Firmware</button>
    </esp-web-install-button>

    <p class="note">
      Works in Chrome / Edge only.<br>
      Hold BOOT if the board is not detected.
    </p>
  </div>
</body>
</html>
